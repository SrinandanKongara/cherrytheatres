services:
  - type: worker
    name: cherrytheatres
    runtime: docker
    plan: starter
    region: singapore
    numInstances: 1
    disk:
      name: snapshots
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: POLL_SECONDS
        value: "120"
